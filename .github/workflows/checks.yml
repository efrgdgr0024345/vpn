name: Isolated client checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-tk xvfb xauth nftables iproute2
      - name: Check source syntax and example JSON
        working-directory: vpn-dashboard
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          PY
          sh -n install.sh
      - name: Run unit and security regression tests
        run: python3 ci/run_units.py vpn-dashboard/tests
      - name: Test lab SSH safeguards and key authorization
        run: python3 ci/run_units.py ci/tests
      - name: Open and close the real Tk dashboard on a virtual display
        run: timeout 20s xvfb-run --auto-servernum python3 ci/desktop_smoke.py
      - name: Check real nftables readback in a separate network namespace
        run: sudo /usr/bin/python3 -I -B ci/nft_smoke.py

  installer-integration:
    name: Real guided client installation (Debian 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise extracted source permissions and real protected installation
        run: sh ci/test_installer_container.sh
      - name: Upgrade the owner's exact earlier release using reviewed current code
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          source = urlopen('https://codeload.github.com/efrgdgr0024345/vpn/zip/04639ebf3f3e83801927633ff32982aa70827aff', timeout=30).read(2000001)
          if hashlib.sha256(source).hexdigest() != '13cea5b979082fc9f815219089ee9c97084ae824f8176d13301164db9674395c':
              raise SystemExit('Earlier public-source archive checksum mismatch.')
          Path('/tmp/vpn-installer-04639eb.zip').write_bytes(source)
          PY
          sh ci/test_installer_container.sh /tmp/vpn-installer-04639eb.zip --updated-installer

  ssh-integration:
    name: Real SSH administration safeguards (Debian 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise actual OpenSSH without production credentials
        run: sh ci/test_ssh_container.sh

  vpn-integration:
    name: Real VPN foundation (Debian 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test real certificates, PAM, OpenVPN, firewall and packet forwarding
        run: sh ci/test_server_container.sh
