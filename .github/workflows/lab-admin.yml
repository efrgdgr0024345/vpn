name: Lab server administration
run-name: Lab server — ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Lab operation (install-foundation changes the disposable server)
        type: choice
        options: [connectivity, inventory, diagnose-connection, ipv4-only-status, enable-ipv4-only, install-admin-panel, prepare-test-access, inspect-test-peer, test-from-peer, install-foundation, test-foundation, probe-udp, prepare-download, close-download, device-status, revoke-device, enable-device, reset-sessions, rotate-password, reboot-lab]
        default: connectivity
      host:
        description: Disposable lab server IPv4 address (public workflow input)
        required: true
        type: string
      host_fingerprint:
        description: ED25519 SHA256 fingerprint verified in the provider console
        required: true
        type: string
      port:
        description: SSH port
        default: '22'
        required: true
        type: string
      download_public_key:
        description: ED25519 PUBLIC key for prepare-download (never enter a private key)
        required: false
        type: string
      device:
        description: Registered device for download, revoke or enable
        type: choice
        options: [kali, iphone, android]
        default: kali
      test_peer_host:
        description: External test peer IPv4 address for inspection or VPN testing
        required: false
        type: string
      test_peer_host_fingerprint:
        description: External peer ED25519 SHA256 fingerprint verified in its provider console
        required: false
        type: string
      test_peer_port:
        description: External test peer SSH port
        default: '22'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vpn-lab-administration
  cancel-in-progress: false

jobs:
  connectivity:
    if: github.repository == 'efrgdgr0024345/vpn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SSH connectivity and pinned host identity
        env:
          VPN_LAB_HOST: ${{ inputs.host }}
          VPN_LAB_HOST_FINGERPRINT: ${{ inputs.host_fingerprint }}
          VPN_LAB_PORT: ${{ inputs.port }}
        run: /usr/bin/python3 -I -B ci/lab_admin.py connectivity

  verified-build:
    needs: connectivity
    if: inputs.operation == 'install-foundation' || inputs.operation == 'prepare-download' || inputs.operation == 'close-download' || inputs.operation == 'revoke-device' || inputs.operation == 'enable-device' || inputs.operation == 'reset-sessions' || inputs.operation == 'rotate-password' || inputs.operation == 'test-foundation' || inputs.operation == 'reboot-lab' || inputs.operation == 'prepare-test-access' || inputs.operation == 'test-from-peer' || inputs.operation == 'enable-ipv4-only' || inputs.operation == 'install-admin-panel'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require successful CI for this deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B ci/require_checks.py

  administration:
    needs: [connectivity, verified-build]
    if: always() && !cancelled() && needs.connectivity.result == 'success' && (needs['verified-build'].result == 'success' || needs['verified-build'].result == 'skipped') && inputs.operation != 'connectivity' && github.repository == 'efrgdgr0024345/vpn' && github.ref == 'refs/heads/main'
    environment: vpn-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run the fixed lab operation over verified SSH
        env:
          VPN_LAB_HOST: ${{ inputs.host }}
          VPN_LAB_HOST_FINGERPRINT: ${{ inputs.host_fingerprint }}
          VPN_LAB_PORT: ${{ inputs.port }}
          VPN_LAB_SSH_PRIVATE_KEY: ${{ secrets.VPN_LAB_SSH_PRIVATE_KEY }}
          VPN_LAB_OPERATION: ${{ inputs.operation }}
          VPN_LAB_DOWNLOAD_PUBLIC_KEY: ${{ inputs.download_public_key }}
          VPN_LAB_DEVICE: ${{ inputs.device }}
          VPN_TEST_PEER_HOST: ${{ inputs.test_peer_host }}
          VPN_TEST_PEER_HOST_FINGERPRINT: ${{ inputs.test_peer_host_fingerprint }}
          VPN_TEST_PEER_PORT: ${{ inputs.test_peer_port }}
        run: /usr/bin/python3 -I -B ci/lab_admin.py "$VPN_LAB_OPERATION"
